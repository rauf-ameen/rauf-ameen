<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .skills-section {
    background-color: #0b132b;
    padding: 60px 8%;
    color: #ffffff;
}

.skills-container {
    max-width: 1100px;
    margin: 0 auto;
}

.skills-container h2 {
    font-size: 32px;
    margin-bottom: 30px;
    color: #ffffff;
}

.skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.skill-card {
    background-color: #111a3a;
    padding: 30px;
    border-radius: 10px;
    border: 1px solid #1e293b;
    transition: 0.3s ease;
}

.skill-card:hover {
    border-color: #3285ff;
    transform: translateY(-5px);
}

.skill-card h3 {
    font-size: 22px;
    margin-bottom: 12px;
    color: #ffffff;
}

.skill-card p {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.5;
}
    </style>
</head>
<body>
    <section class="skills-section" id="skills">
    <div class="skills-container">
        <h2>What I Know</h2>
        
        <div class="skills-grid">
            <div class="skill-card">
                <h3>HTML</h3>
                <p>Markup language for structuring web pages.</p>
            </div>
            <div class="skill-card">
                <h3>CSS</h3>
                <p>Styling and layout for beautiful websites.</p>
            </div>
            <div class="skill-card">
                <h3>Java</h3>
                <p>Object-oriented programming language.</p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
